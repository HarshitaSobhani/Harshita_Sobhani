<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sentinel CCTV Integration Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0b1220; color: #e6ebf5; }
  header { padding: 12px 20px; background: #101a2e; border-bottom: 1px solid #223050; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 4px 0 0; font-size: 12px; color: #93a2c2; }
  .layout { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; padding: 12px; height: calc(100vh - 70px); box-sizing: border-box; }
  #map { height: 100%; border-radius: 8px; overflow: hidden; }
  .panel { background: #101a2e; border: 1px solid #223050; border-radius: 8px; padding: 12px; overflow-y: auto; }
  .panel h2 { font-size: 14px; margin: 0 0 8px; color: #9fb4e0; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  input, button { background: #16213d; border: 1px solid #2a3a63; color: #e6ebf5; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  button { cursor: pointer; }
  button:hover { background: #1d2c52; }
  .alert-item { border-left: 3px solid #ef4444; background: #1a1220; padding: 8px; margin-bottom: 6px; border-radius: 4px; font-size: 12px; }
  .track-item { padding: 6px 0; border-bottom: 1px solid #223050; font-size: 12px; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 999px; font-size: 10px; margin-left: 6px; }
  .online { background: #14532d; color: #86efac; }
  .offline { background: #4c1d1d; color: #fca5a5; }
  .maintenance { background: #4a3b0f; color: #fcd34d; }
  .unknown { background: #333; color: #ccc; }
</style>
</head>
<body>
<header>
  <h1>Sentinel &mdash; Unified CCTV Registry, GIS &amp; Analytics</h1>
  <p>Model 1 (Registry &amp; GIS Foundation) + Model 2 (Unified Viewing &amp; Analytics) &mdash; Gujarat Police Innovation Hackathon 2026</p>
</header>
<div class="layout">
  <div id="map"></div>
  <div class="panel" id="side-panel">
    <h2>Vehicle Track Search</h2>
    <div class="row">
      <input id="reg-input" placeholder="e.g. GJ01AB1234" />
      <button id="track-btn">Track</button>
    </div>
    <div id="track-results"></div>

    <h2 style="margin-top:16px;">Live Alerts (Watchlist Matches)</h2>
    <div class="row">
      <button id="refresh-alerts-btn">Refresh</button>
      <button id="simulate-btn">Simulate Detection</button>
    </div>
    <div id="alerts-list"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API_BASE = window.SENTINEL_API_BASE || "http://localhost:8000";

const map = L.map("map").setView([22.5, 71.5], 7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap contributors",
}).addTo(map);

const statusColor = { online: "#22c55e", offline: "#ef4444", maintenance: "#f59e0b", unknown: "#9ca3af" };
let cameraMarkers = {};

async function loadCameras() {
  const res = await fetch(`${API_BASE}/api/gis/cameras.geojson`);
  const geojson = await res.json();
  L.geoJSON(geojson, {
    pointToLayer: (feature, latlng) => {
      const marker = L.circleMarker(latlng, {
        radius: 7,
        color: statusColor[feature.properties.status] || statusColor.unknown,
        fillColor: statusColor[feature.properties.status] || statusColor.unknown,
        fillOpacity: 0.8,
      });
      marker.bindPopup(
        `<b>${feature.properties.name}</b><br/>Code: ${feature.properties.code}<br/>` +
        `VMS: ${feature.properties.vms_platform || "n/a"}<br/>Status: ${feature.properties.status}`
      );
      cameraMarkers[feature.properties.id] = marker;
      return marker;
    },
  }).addTo(map);
}

async function trackVehicle() {
  const regNo = document.getElementById("reg-input").value.trim();
  if (!regNo) return;
  const res = await fetch(`${API_BASE}/api/analytics/vehicle-track/${encodeURIComponent(regNo)}`);
  const data = await res.json();
  const container = document.getElementById("track-results");
  if (!data.hits) {
    container.innerHTML = `<p style="font-size:12px;color:#93a2c2;">No detections found for ${regNo} yet.</p>`;
    return;
  }
  container.innerHTML = data.route
    .map(
      (hit) => `<div class="track-item"><b>${hit.camera_name}</b> (${hit.camera_code})<br/>
      ${new Date(hit.detected_at).toLocaleString()} &middot; confidence ${(hit.confidence * 100).toFixed(0)}%</div>`
    )
    .join("");

  const latlngs = data.route.filter((h) => h.latitude).map((h) => [h.latitude, h.longitude]);
  if (latlngs.length) {
    L.polyline(latlngs, { color: "#38bdf8", weight: 3, dashArray: "4 4" }).addTo(map);
    map.fitBounds(latlngs);
  }
}

async function loadAlerts() {
  const res = await fetch(`${API_BASE}/api/analytics/alerts`);
  const alerts = await res.json();
  const list = document.getElementById("alerts-list");
  if (!alerts.length) {
    list.innerHTML = `<p style="font-size:12px;color:#93a2c2;">No alerts yet.</p>`;
    return;
  }
  list.innerHTML = alerts
    .map(
      (a) => `<div class="alert-item"><b>ALERT</b> &middot; ${new Date(a.created_at).toLocaleString()}<br/>${a.message}</div>`
    )
    .join("");
}

async function simulateDetection() {
  const res = await fetch(`${API_BASE}/api/watchlist/`);
  const watchlist = await res.json();
  if (!watchlist.length) return;
  const entry = watchlist[Math.floor(Math.random() * watchlist.length)];
  const camerasRes = await fetch(`${API_BASE}/api/cameras/`);
  const cameras = await camerasRes.json();
  if (!cameras.length) return;
  const camera = cameras[Math.floor(Math.random() * cameras.length)];
  await fetch(`${API_BASE}/api/analytics/detections`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      camera_id: camera.id,
      detection_type: "anpr",
      value: entry.reference_no,
      confidence: 0.9,
    }),
  });
  loadAlerts();
}

document.getElementById("track-btn").addEventListener("click", trackVehicle);
document.getElementById("refresh-alerts-btn").addEventListener("click", loadAlerts);
document.getElementById("simulate-btn").addEventListener("click", simulateDetection);

loadCameras();
loadAlerts();
</script>
</body>
</html>
